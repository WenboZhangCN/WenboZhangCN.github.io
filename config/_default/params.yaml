hugoblox:
  schema: "2.0"
  identity:
    name: Wenbo Zhang
    type: person
    tagline: "Body-State-Aware Wearable Intelligence"
    description: "Wenbo Zhang is a PhD candidate at South China University of Technology and a visiting researcher at UCL, working on wearable sensing, body-state modelling, and closed-loop feedback for human movement and interaction."
  theme:
    mode: light
    pack: default
    colors:
      primary: "#30356B"
      secondary: "#087F8C"
      neutral: "slate"
  typography:
    font: sans
    size: md
  layout:
    radius: md
    spacing: comfortable
    avatar_shape: circle
  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: false
    theme_toggle: false
  footer:
    style: minimal
    language_switcher: false
  copyright:
    notice: "Copyright {year} {name}"
  content:
    math:
      enable: true
    toc:
      enable: true
    reading_time:
      enable: true
  search:
    enable: false
